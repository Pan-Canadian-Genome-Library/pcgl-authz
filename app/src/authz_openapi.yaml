openapi: 3.0.0
info:
  version: v2.0.0
  title: 'PCGL Authorization Service'
  description: 'API for determining authorization in PCGL'
servers:
  - url: http://localhost:1235/
  - url: /
paths:
  /service-info:
    get:
      summary: Retrieve information about this service
      description: Returns information about the ingest service
      operationId: authz_operations.get_service_info
      responses:
        "2XX":
          description: Retrieve info about the ingest service
          content:
            application/json:
              schema:
                type: object
  /healthcheck:
    get:
      summary: Report health status of service
      description: Report health status of service
      operationId: authz_operations.healthcheck
      responses:
        "2XX":
          description: Service is healthy
          content:
            application/json:
              schema:
                type: object
        "4XX":
          description: Service is unhealthy
          content:
            application/json:
              schema:
                type: object

  /group/{group_id}:
    parameters:
      - in: path
        name: group_id
        description: the name of the group in COManage
        schema:
          type: string
        required: true
    get:
      summary: List users in group
      description: List users in group
      operationId: authz_operations.list_group
      security:
        - bearerAuth: []
        - serviceIdAuth: []
          serviceTokenAuth: []
      responses:
        "2XX":
          description: Success
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/UserInfo"
  /service:
    get:
      summary: List registered services
      operationId: authz_operations.list_services
      security:
      - bearerAuth: []
      responses:
        "2XX":
          description: Success
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ServiceRegistration'
    post:
      summary: Register service in authorization system
      operationId: authz_operations.add_service
      security:
      - bearerAuth: []
      requestBody:
        $ref: '#/components/requestBodies/ServiceRegistrationRequest'
      responses:
        "2XX":
          description: Success. Includes the assigned service UUID. The registering service needs to save the UUID for creating verification tokens.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceRegistration'
  /service/{service_id}:
    parameters:
      - in: path
        name: service_id
        schema:
          type: string
        required: true
    get:
      summary: Get registered service
      operationId: authz_operations.get_service
      security:
      - bearerAuth: []
      responses:
        "2XX":
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceRegistration'
    delete:
      summary: Remove registered service
      operationId: authz_operations.remove_service
      security:
      - bearerAuth: []
      responses:
        "2XX":
          description: Success
  /service/{service_id}/verify:
    parameters:
      - in: path
        name: service_id
        schema:
          type: string
        required: true
    get:
      summary: Verify a service token
      operationId: authz_operations.verify_service_token
      parameters:
        - in: header
          name: X-Service-Token
          schema:
            type: string
          required: true
      responses:
        "2XX":
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  result:
                    description: Whether or not the service token comes from the service
                    type: boolean
    post:
      summary: Create a verification token for a service
      operationId: authz_operations.create_service_token
      requestBody:
        $ref: '#/components/requestBodies/ServiceVerificationTokenRequest'
      responses:
        "2XX":
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  token:
                    type: string
                    description: service token
  /study:
    parameters:
      - $ref: "#/components/parameters/ServiceId"
      - $ref: "#/components/parameters/ServiceToken"
    post:
      summary: Add authorization information for a study
      description: Add authorization information for a study
      operationId: authz_operations.add_study_authorization
      security:
      - bearerAuth: []
      requestBody:
        $ref: '#/components/requestBodies/StudyAuthorizationRequest'
      responses:
          "2XX":
            description: Success
            content:
              application/json:
                schema:
                  $ref: '#/components/schemas/StudyAuthorization'
    get:
      summary: List registered studies
      description: List studies authorized on server
      operationId: authz_operations.list_study_authorizations
      security:
      - bearerAuth: []
      responses:
        "2XX":
          description: Success
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/StudyAuthorization'
  /study/{study_id}:
    parameters:
      - $ref: "#/components/parameters/ServiceId"
      - $ref: "#/components/parameters/ServiceToken"
      - in: path
        name: study_id
        schema:
          type: string
        required: true
    get:
      summary: Get authorization information for a study
      description: Get authorization information for a study
      operationId: authz_operations.get_study_authorization
      security:
      - bearerAuth: []
      responses:
        "2XX":
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StudyAuthorization'
    delete:
      description: Delete a study
      operationId: authz_operations.remove_study_authorization
      security:
      - bearerAuth: []
      responses:
        "2XX":
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StudyAuthorization'
  /study/{study_id}/dac_authorizations:
    parameters:
      - $ref: "#/components/parameters/ServiceId"
      - $ref: "#/components/parameters/ServiceToken"
      - in: path
        name: study_id
        schema:
          type: string
        required: true
    get:
      summary: Get authorization information for a study
      description: Get authorization information for a study
      operationId: authz_operations.get_study_dac_authorizations
      security:
      # the bearer token must belong to a chair or member of the DAC responsible for this study
      - bearerAuth: []
      responses:
        "2XX":
          description: Success
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
    post:
      summary: Add DAC authorizations for a study for a group of users
      description: Authorize a study for a group of users (or update a study auth for a set of users)
      operationId: authz_operations.add_study_dac_authorizations
      security:
      # the bearer token must belong to the chair of the DAC responsible for this study
      - bearerAuth: []
      requestBody:
        $ref: '#/components/requestBodies/StudyDACAuthorizationRequest'
      responses:
        "2XX":
          description: Success
          content:
            application/json:
              schema:
                type: object
    delete:
      summary: Revoke DAC authorizations for a study for a group of users
      description: Revoke a study for a group of users (or update a study auth for a set of users)
      operationId: authz_operations.revoke_study_dac_authorizations
      security:
      # the bearer token must belong to the chair of the DAC responsible for this study
      - bearerAuth: []
      requestBody:
        $ref: '#/components/requestBodies/StudyDACRevocationRequest'
      responses:
        "2XX":
          description: Success
          content:
            application/json:
              schema:
                type: object
  /user/lookup:
    parameters:
      - $ref: "#/components/parameters/ServiceId"
      - $ref: "#/components/parameters/ServiceToken"
      - in: query
        name: email
        schema:
          type: string
        required: false
    get:
      summary: Look up a PCGL user
      description: Look up a PCGL user
      operationId: authz_operations.lookup_user
      security:
      - bearerAuth: []
      responses:
        "2XX":
          description: Success
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
  /user/{pcgl_id}:
    parameters:
      - $ref: "#/components/parameters/ServiceId"
      - $ref: "#/components/parameters/ServiceToken"
      - in: path
        name: pcgl_id
        schema:
          type: string
        required: true
    get:
      summary: List user authorizations
      description: List authorizations for a user. If the pcgl_id is `me`, returns the information for the user associated with the bearer token.
      operationId: authz_operations.list_authz_for_user
      security:
      - bearerAuth: []
      responses:
        "2XX":
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserAuthorization'
        "401":
          description: User token is invalid
        "403":
          description: Service token is invalid
  /allowed:
    parameters:
      - $ref: "#/components/parameters/ServiceId"
      - $ref: "#/components/parameters/ServiceToken"
    post:
      summary: Is the authorized user allowed to perform the requested action?
      description: Returns whether a user is allowed to perform the requested action on the specified datasets
      operationId: authz_operations.is_allowed
      security:
      - bearerAuth: []
      requestBody:
        $ref: '#/components/requestBodies/ActionAuthorizationRequest'
      responses:
        "2XX":
          description: Success
          content:
            application/json:
              schema:
                type: array
                items:
                  type: boolean
  /reload:
    post:
      summary: Reload users and groups from COManage
      operationId: authz_operations.reload_comanage
      security:
        - bearerAuth: []
        - serviceIdAuth: []
          serviceTokenAuth: []
      responses:
        "2XX":
          description: Success

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      x-bearerInfoFunc: authz_operations.handle_token
    serviceIdAuth:
      type: apiKey
      name: X-Service-Id
      in: header
      x-apikeyInfoFunc: authz_operations.handle_service_id_auth
    serviceTokenAuth:
      type: apiKey
      name: X-Service-Token
      in: header
      x-apikeyInfoFunc: authz_operations.handle_service_auth
  parameters:
    ServiceId:
      in: header
      name: X-Service-Id
      required: false
      schema:
        type: string
      description: ID of a registered service
    ServiceToken:
      in: header
      name: X-Service-Token
      required: false
      schema:
        type: string
      description: service token created for the service specified by X-Service-Id
  requestBodies:
    ServiceRegistrationRequest:
      content:
        'application/json':
          schema:
            $ref: "#/components/schemas/ServiceRegistration"
    ServiceVerificationTokenRequest:
      content:
        'application/json':
          schema:
            type: object
            properties:
              service_uuid:
                type: string
                description: UUID of service, returned as part of service registration
            required:
              - service_uuid
    StudyAuthorizationRequest:
      content:
        'application/json':
          schema:
            $ref: "#/components/schemas/StudyAuthorization"
    StudyDACAuthorizationRequest:
      content:
        'application/json':
          schema:
            $ref: "#/components/schemas/StudyDACAuthorization"
    StudyDACRevocationRequest:
      content:
        'application/json':
          schema:
            type: object
            description: a DAC revocation for multiple users for the given study
            properties:
              user_emails:
                type: array
                items:
                  type: string
    ActionAuthorizationRequest:
      content:
        'application/json':
          schema:
            type: object
            required:
              - action
            properties:
              action:
                $ref: "#/components/schemas/Action"
              studies:
                description: IDs of the studies for which authorization is being requested
                type: array
                items:
                  type: string
  schemas:
    ServiceRegistration:
      type: object
      description: PCGL service and its authorizable actions.
      required:
        - service_id
        - readable
        - editable
        - authorization
      properties:
        service_id:
          type: string
          description: ID of service
        readable:
          type: array
          description: Actions that allow a user to read data. Note that UPDATE and DELETE are not readable methods.
          items:
            $ref: "#/components/schemas/Action"
        editable:
          type: array
          description: Actions that allow a user to edit and delete data
          items:
            $ref: "#/components/schemas/Action"
        authorization:
          type: object
          description: Information about the OIDC client associated with the service. This information is required to be submitted when registering a service, but will not be returned on GET requests for security reasons.
          required:
            - client_id
            - client_secret
            - token_type
          properties:
            client_id:
              type: string
            client_secret:
              type: string
            token_type:
              type: string
              description: Which type of token should authz handle for this service? If access is specified, the service will need to exchange any refresh tokens for access tokens on their end.
              default: access
              enum:
                - refresh
                - access
    StudyAuthorization:
      type: object
      description: study and the researchers involved in this study
      properties:
        study_id:
          type: string
          description: name of the study
        data_submitters:
          type: array
          description: list of users who are data submitters for this study
          items:
            type: string
        team_members:
          type: array
          description: list of users who are original researchers for this study
          items:
            type: string
        creation_date:
          type: string
          description: date study was created, for embargo purposes. This may or may not be the date of ingest.
        dac_id:
          type: string
          description: The ID of the responsible DAC, found in the name of the COManage group, e.g. PCGL:DACO:Member:{dac_id} or PCGL:DACO:Chair:{dac_id}.
      required:
        - study_id
        - data_submitters
        - team_members
    StudyDACAuthorization:
      type: object
      description: a DAC approval for multiple users for the given study
      properties:
        user_emails:
          type: array
          items:
            type: string
        start_date:
          type: string
        end_date:
          type: string
      required:
        - user_emails
        - start_date
        - end_date
    Action:
      type: object
      description: an action for which authorization is requested
      properties:
        endpoint:
          description: path to an endpoint that performs the requested action. Should be in the form of a GoLang regex, e.g. `/users/?.*`
          type: string
        method:
          description: the operation to be performed.
          type: string
          enum:
            - GET
            - POST
            - UPDATE
            - DELETE
      required:
        - endpoint
        - method
    UserAuthorization:
      type: object
      description: describes an authorized user and the studies the user is authorized to view
      properties:
        userinfo:
          $ref: "#/components/schemas/UserInfo"
        groups:
          type: array
          items:
            $ref: "#/components/schemas/COManageGroup"
        study_authorizations:
          type: object
          description: A compiled list of which studies the user has read and edit access for at the current time
          properties:
            readable_studies:
              type: array
              description: list of studies that the user can read
              items:
                type: string
            editable_studies:
              type: array
              description: list of studies that the user can edit
              items:
                type: string
        dac_authorizations:
          type: array
          items:
            type: object
            description: a DAC approval that authorizes a user to access a study for a specified date range
            properties:
              study_id:
                type: string
              start_date:
                type: string
              end_date:
                type: string
    UserInfo:
      type: object
      description: describes an authenticated user
      properties:
        emails:
          type: array
          items:
            $ref: "#/components/schemas/Email"
          description: a list of verified emails associated with the user
        pcgl_id:
          type: string
          description: user's pcgl ID
      required:
        - pcgl_id
    Email:
      type: object
      description: email address and its properties
      properties:
        address:
          type: string
          description: email address
        type:
          type: string
          description: enumerated type, as listed in https://spaces.at.internet2.edu/display/COmanage/Recommendations+For+Email+Addresses
    COManageGroup:
      type: object
      description: Information about the group from COManage
      properties:
        description:
          type: string
          description: group description
        id:
          type: integer
          description: group COID
        name:
          type: string
          description: group name
